services:
  mysql:
    image: mysql:8.0
    container_name: api-financas-mysql
    restart: always
    environment:
      MYSQL_DATABASE: bd_apifinancas
      MYSQL_USER: apifinancas
      MYSQL_PASSWORD: apifinancas
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - api-financas-network
    healthcheck:
      test:
        ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    container_name: api-financas-phpmyadmin
    restart: always
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - api-financas-network

networks:
  api-financas-network:
    driver: bridge

volumes:
  mysql_data:
